[package]
name = "truewire-weather-gov"
version = "0.2.0"
edition = "2021"
description = "Typed, validated Rust client for the US National Weather Service API, generated by Truewire."
license = "MIT"
repository = "https://github.com/truewire-dev/weather-gov"
homepage = "https://truewire.dev"
documentation = "https://docs.rs/truewire-weather-gov"
readme = "README.md"
keywords = ["weather", "forecast", "nws", "api-bindings", "truewire"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
# The package is `truewire-weather-gov`, matching the PyPI and npm names, but the library
# it exposes is `weather_gov`, which is what the generated source, the tests and the
# README all import.
name = "weather_gov"
path = "src/weather_gov/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
truewire-core = { version = "0.1", features = ["rustls-tls"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
