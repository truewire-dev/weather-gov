[package]
name = "weather_gov"
version = "0.1.0"
edition = "2021"
description = "Typed, validated Rust client for the US National Weather Service API, generated by Truewire."
license = "MIT"
publish = false

[lib]
path = "src/weather_gov/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
# The crate is not on crates.io yet (the name is reserved with a placeholder), and a path
# dependency would point outside this repository, so CI could not build it.
truewire-core = { git = "https://github.com/truewire-dev/truewire", branch = "main", features = [
  "rustls-tls",
] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
